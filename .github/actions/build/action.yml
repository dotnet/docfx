name: build
description: build the project
inputs:
  project:
    description: Project or solution to build
    default: docfx.slnx
  framework:
    description: Build only this target framework when specified
    default: ''
  cache:
    description: Cache npm and NuGet downloads
    default: 'false'
runs:
  using: "composite"
  steps:
  - uses: actions/setup-node@v6
    with:
      node-version: 24
      cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
      cache-dependency-path: templates/package-lock.json

  - uses: actions/setup-dotnet@v6
    with:
      dotnet-version: |
        11.x
        10.x
        9.x
        8.x

  - uses: actions/cache@v6
    if: inputs.cache == 'true'
    with:
      path: ~/.nuget/packages
      key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
      restore-keys: |
        nuget-${{ runner.os }}-${{ runner.arch }}-

  - name: Install fonts-noto-color-emoji package (Linux only)
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y fonts-noto-color-emoji

  - run: npm ci
    shell: bash
    working-directory: templates

  - run: npm run build
    shell: bash
    working-directory: templates

  - name: Build .NET projects
    shell: bash
    env:
      BUILD_PROJECT: ${{ inputs.project }}
      BUILD_FRAMEWORK: ${{ inputs.framework }}
    run: |
      args=("$BUILD_PROJECT")
      if [[ -n "$BUILD_FRAMEWORK" ]]; then
        args+=(--framework "$BUILD_FRAMEWORK")
      fi
      dotnet build "${args[@]}" -c Release --warnAsError --maxcpucount --binaryLogger
