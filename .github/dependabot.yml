version: 2
updates:
- package-ecosystem: nuget
  target-branch: main
  directory: "/"
  schedule:
    interval: daily
  ignore:
    # Verify updates are manual; overlapping NuGet update blocks are not supported.
    - dependency-name: "Verify.*"
    # Keep patch updates automatic; Roslyn minor/major upgrades need per-TFM review.
    - dependency-name: "Microsoft.CodeAnalysis"
      update-types:
        - "version-update:semver-minor"
        - "version-update:semver-major"
    - dependency-name: "Microsoft.CodeAnalysis.*"
      update-types:
        - "version-update:semver-minor"
        - "version-update:semver-major"
  groups:
    roslyn:
      patterns:
      - "Microsoft.CodeAnalysis"
      - "Microsoft.CodeAnalysis.*"
    spectre:
      patterns:
      - "Spectre.Console"
      - "Spectre.Console.*"
    xunit:
      patterns:
      - "xunit"
      - "xunit.*"
      - "xunit.v3"
      - "xunit.v3.*"

- package-ecosystem: npm
  target-branch: main
  directory: "/templates"
  schedule:
    interval: daily
  cooldown:
    default-days: 14
  groups:
    typescript-eslint:
      patterns:
      - "@typescript-eslint/*"
  ignore:
     # Ignore default template dependency update due to missing tests
  - dependency-name: '@default/*'
  - dependency-name: 'jquery'

- package-ecosystem: "github-actions"
  directory: "/"
  schedule: 
    interval: daily
  target-branch: main
