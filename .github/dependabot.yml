version: 2
updates:
- package-ecosystem: nuget
  target-branch: main
  directory: "/"
  schedule:
    interval: monthly
  ignore:
    # Verify updates are manual; overlapping NuGet update blocks are not supported.
    - dependency-name: "Verify.*"
    # Keep patch updates automatic; Roslyn minor/major upgrades need per-TFM review.
    - dependency-name: "Microsoft.CodeAnalysis"
      update-types:
        - "version-update:semver-minor"
        - "version-update:semver-major"
    - dependency-name: "Microsoft.CodeAnalysis.*"
      update-types:
        - "version-update:semver-minor"
        - "version-update:semver-major"
  groups:
    nuget-dependencies:
      applies-to: version-updates
      patterns:
      - "*"

- package-ecosystem: npm
  target-branch: main
  directory: "/templates"
  schedule:
    interval: monthly
  cooldown:
    default-days: 14
  groups:
    npm-dependencies:
      applies-to: version-updates
      patterns:
      - "*"
  ignore:
     # Ignore default template dependency update due to missing tests
  - dependency-name: '@default/*'
  - dependency-name: 'jquery'

- package-ecosystem: "github-actions"
  directory: "/"
  schedule: 
    interval: monthly
  target-branch: main
  groups:
    github-actions:
      applies-to: version-updates
      patterns:
      - "*"
